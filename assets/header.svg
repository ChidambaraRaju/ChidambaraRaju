<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">Raju (Juu) - cozy terminal</title>
  <desc id="desc">Aspiring Agentic AI Developer | GenAI | LLMs</desc>

  <defs>
    <linearGradient id="windowFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a231c"/>
      <stop offset="55%" stop-color="#1c1916"/>
      <stop offset="100%" stop-color="#161310"/>
    </linearGradient>
    <linearGradient id="titleBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#322a22"/>
      <stop offset="100%" stop-color="#241e18"/>
    </linearGradient>
    <linearGradient id="statusBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a2e22"/>
      <stop offset="100%" stop-color="#2d241c"/>
    </linearGradient>
    <radialGradient id="lamp" cx="18%" cy="8%" r="70%">
      <stop offset="0%" stop-color="#d6a05c" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#d6a05c" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#1c1916" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.07"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="windowClip">
      <rect x="18" y="14" width="864" height="192" rx="16"/>
    </clipPath>
  </defs>

  <rect x="22" y="20" width="864" height="192" rx="16" fill="#000000" opacity="0.28"/>

  <g clip-path="url(#windowClip)">
    <rect x="18" y="14" width="864" height="192" fill="url(#windowFill)"/>
    <rect x="18" y="14" width="864" height="192" fill="url(#lamp)"/>
    <rect x="18" y="14" width="864" height="192" filter="url(#grain)" opacity="0.55"/>

    <rect x="18" y="14" width="864" height="38" fill="url(#titleBar)"/>
    <rect x="18" y="51" width="864" height="1" fill="#3f342a"/>

    <circle cx="44" cy="33" r="6" fill="#8a4a42"/>
    <circle cx="66" cy="33" r="6" fill="#b08a4a"/>
    <circle cx="88" cy="33" r="6" fill="#6b7a52"/>

    <text x="450" y="38" text-anchor="middle" fill="#c4b8a8" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="13">raju / agents</text>

    <text x="40" y="86" fill="#5c5348" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="12">1</text>
    <text x="40" y="124" fill="#5c5348" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="12">2</text>
    <text x="40" y="154" fill="#5c5348" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="12">3</text>

    <text x="68" y="86" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="15">
      <tspan fill="#7aa89a">raju</tspan><tspan fill="#8a7a68">@</tspan><tspan fill="#7aa89a">home</tspan>
      <tspan fill="#8a7a68"> ~</tspan>
    </text>

    <text x="68" y="128" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="36" font-weight="700">
      <tspan fill="#ebe6de">Raju (Juu)</tspan><tspan fill="#d6a05c" dx="8" font-size="28">&#9608;<animate attributeName="opacity" values="1;1;0;0" dur="1.15s" repeatCount="indefinite"/></tspan>
    </text>

    <text x="68" y="154" fill="#b7aa96" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="14">Aspiring Agentic AI Developer  |  GenAI  |  LLMs</text>

    <rect x="18" y="182" width="864" height="24" fill="url(#statusBar)"/>
    <text x="40" y="198" fill="#d6a05c" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="11">&gt; agents</text>
    <text x="130" y="198" fill="#8f8374" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="11">python</text>
    <text x="200" y="198" fill="#8f8374" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="11">utf-8</text>
    <text x="850" y="198" text-anchor="end" fill="#8f8374" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="11">workshop</text>
  </g>

  <rect x="18" y="14" width="864" height="192" rx="16" fill="none" stroke="#4a3c30" stroke-width="1.25"/>
  <rect x="19.5" y="15.5" width="861" height="189" rx="15" fill="none" stroke="#f0e6d6" stroke-opacity="0.06"/>
</svg>
